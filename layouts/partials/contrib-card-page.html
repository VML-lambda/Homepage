<div class="card mb-3" style="width: 97%">
  <div class="card-body" style="display: flex; align-items: center; gap: 1.5rem;">
    <div>
      <h6 class="card-title mb-2">
        {{ .Title }}
        <br />
        {{ with .Params.organization }}{{ if ne . "" }}<small class="text-muted">{{ . }}</small><br />{{ end }}{{ end }}
        {{ with .Params.orgName }}{{ if ne . "" }}<small class="text-muted">{{ . }}</small><br />{{ end }}{{ end }}
        {{ with .Params.meetingName }}{{ if ne . "" }}<small class="text-muted">{{ . }}</small>{{ end }}{{ end }}
      </h6>
      {{ partial "author-line.html" . }}
      <p class="card-text text-muted mb-0 small"><strong>{{ .Params.yearMonth }}</strong></p>
    </div>
  </div>
</div>
